
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="phone-screen">

        <h2 class="page-heading">Recommended Videos</h2>

        <div class="video-card">

            <div class="video-thumbnail">
                <img src="https://picsum.photos/600/340?random=11"
                     alt="Video thumbnail">
                <span class="video-duration">10:25</span>
            </div>

            <div class="video-details">

                <img class="channel-picture"
                     src="https://picsum.photos/100?random=21"
                     alt="Channel picture">

                <div class="video-info">
                    <h3 class="video-title">
                        Learn Web Development for Beginners
                    </h3>
                    <p class="video-meta">
                        Tech Tutor • 120K views • 2 days ago
                    </p>
                </div>

                <span class="video-menu">⋮</span>

            </div>

            <div class="video-actions">
                <button class="like-button">♡ Like</button>
                <button class="comment-button">Comment</button>
                <button class="share-button">Share</button>
            </div>

        </div>


        <div class="video-card">

            <div class="video-thumbnail">
                <img src="https://picsum.photos/600/340?random=12"
                     alt="Video thumbnail">
                <span class="video-duration">08:40</span>
            </div>

            <div class="video-details">

                <img class="channel-picture"
                     src="https://picsum.photos/100?random=22"
                     alt="Channel picture">

                <div class="video-info">
                    <h3 class="video-title">
                        HTML and CSS Complete Tutorial
                    </h3>
                    <p class="video-meta">
                        Code Academy • 85K views • 1 week ago
                    </p>
                </div>

                <span class="video-menu">⋮</span>

            </div>

            <div class="video-actions">
                <button class="like-button">♡ Like</button>
                <button class="comment-button">Comment</button>
                <button class="share-button">Share</button>
            </div>

        </div>


        <div class="video-card">

            <div class="video-thumbnail">
                <img src="https://picsum.photos/600/340?random=13"
                     alt="Video thumbnail">
                <span class="video-duration">12:15</span>
            </div>

            <div class="video-details">

                <img class="channel-picture"
                     src="https://picsum.photos/100?random=23"
                     alt="Channel picture">

                <div class="video-info">
                    <h3 class="video-title">
                        JavaScript Projects for Beginners
                    </h3>
                    <p class="video-meta">
                        Coding World • 50K views • 3 days ago
                    </p>
                </div>

                <span class="video-menu">⋮</span>

            </div>

            <div class="video-actions">
                <button class="like-button">♡ Like</button>
                <button class="comment-button">Comment</button>
                <button class="share-button">Share</button>
            </div>

        </div>

    </div>

</body>
</html>
